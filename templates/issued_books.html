<!DOCTYPE html>
<html>
<head>
    <title>Issued Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">

<h2>Issued Books</h2>

<table border="1" class="table table-bordered table-striped">

    <tr>
        <th>Student Name</th>
        <th>Book Title</th>
        <th>Issue Date</th>
        <th>Return Date</th>
        <th>Action</th>
    </tr>

    {% for item in issued %}

    <tr>

        <td>{{ item[0] }}</td>
        <td>{{ item[1] }}</td>
        <td>{{ item[2] }}</td>
        <td>{{ item[3] }}</td>
        <td>
    <a href="/return/{{ item[4] }}">
        Return
    </a>
</td>

    </tr>

    {% endfor %}

</table>
</div>
</body>
</html>
