<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">

    <form action="/update/{{book[0]}}" method="POST">
        title:<input type="text" name="title" value="{{ book[1] }}" class="form-control">
                author:<input type="text" name="author" value="{{ book[2] }}" class="form-control">
        category:<input type="text" name="category" value="{{ book[3] }}" class="form-control">
        quantity:<input type="number" name="quantity" value="{{ book[4] }}" class="form-control">
<button class="btn btn-primary">submit</button>
    </form>
    </div>
</body>
</html>
