<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="w-50">

        <h2 class="mb-4">
            Login
        </h2>

        <form action="/login" method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input type="text"
                       name="user"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="pass"
                       class="form-control">

            </div>

            <button type="submit"
                    class="btn btn-primary">

                Login

            </button>

        </form>

    </div>

</div>

</body>
</html>
