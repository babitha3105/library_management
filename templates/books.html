<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Books</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <!-- SEARCH -->
    <form action="/books" method="GET" class="d-flex mb-3">

        <input type="text"
               name="search"
               class="form-control me-2"
               placeholder="Search book title">

        <button type="submit" class="btn btn-primary">
            Search
        </button>

    </form>

    <!-- BUTTONS -->
    <div class="mb-3">

        <a href="/addbook" class="btn btn-success">
            Add Book
        </a>

        <a href="/issue" class="btn btn-warning">
            Issue Book
        </a>

        <a href="/issuedbooks" class="btn btn-info">
            Issued Books
        </a>

        <a href="/logout" class="btn btn-danger">
            Logout
        </a>
        <a href="/dashboard" class="btn btn-dark">Dashboard</a>

    </div>

    <!-- TABLE -->
    <table class="table table-bordered table-striped">

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
            <th>Qty</th>
            <th>Delete</th>
            <th>Edit</th>
        </tr>

        {% for book in books %}

        <tr>

            <td>{{ book[0] }}</td>
            <td>{{ book[1] }}</td>
            <td>{{ book[2] }}</td>
            <td>{{ book[3] }}</td>
            <td>{{ book[4] }}</td>

            <td>
                <a href="/delete/{{ book[0] }}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>

            <td>
                <a href="/edit/{{ book[0] }}"
                   class="btn btn-primary btn-sm">
                    Edit
                </a>
            </td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
