<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="w-50">

        <h2 class="mb-4">
            Add Book
        </h2>


        <form action="/add" method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Title
                </label>

                <input type="text"
                       name="title"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Author
                </label>

                <input type="text"
                       name="author"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Category
                </label>

                <input type="text"
                       name="category"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Quantity
                </label>

                <input type="number"
                       name="quantity"
                       class="form-control">

            </div>

            <button class="btn btn-primary">
                Add Book
            </button>

        </form>
    </div>

</div>

</body>
</html>
