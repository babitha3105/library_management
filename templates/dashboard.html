<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">Library Dashboard</h2>

    <div class="row">

        <div class="col-md-4">

            <div class="card text-white bg-primary mb-3">

                <div class="card-body">

                    <h5>Total Books</h5>

                    <h2>{{ total_books }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-white bg-success mb-3">

                <div class="card-body">

                    <h5>Available Books</h5>

                    <h2>{{ available_books }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-white bg-danger mb-3">

                <div class="card-body">

                    <h5>Issued Books</h5>

                    <h2>{{ issued_books }}</h2>

                </div>

            </div>

        </div>

    </div>

    <a href="/books" class="btn btn-dark mt-3">
        Go to Books
    </a>

</div>

</body>
</html>
